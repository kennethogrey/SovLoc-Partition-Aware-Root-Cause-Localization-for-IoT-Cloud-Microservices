# Real multi-container deployment of the mesh (production tier).
# Start with:   ./scripts/compose_up.sh            (computes a shared clock zero)
# Partition:    ./scripts/partition_docker.sh 40   (cuts the cloud collector 40s)
# Degrade link: ./scripts/netem.sh sovloc-cloud add 200 10   (200ms +10% loss)
#
# The two collectors run the SAME rca-core. A partition of the `cloud` collector
# reproduces the sovereignty result on real container networking.

name: sovloc

x-svc: &svc
  build:
    context: .
    target: runtime
  restart: "no"
  cap_add: ["NET_ADMIN"] # allow tc/netem inside the container
  depends_on: [cloud, edge]

services:
  cloud:
    build:
      context: .
      target: runtime
    command: ["collector","--name","cloud","--port","7000","--expect-culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15"]
    cap_add: ["NET_ADMIN"]
  edge:
    build:
      context: .
      target: runtime
    command: ["collector","--name","edge","--port","7001","--expect-culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15"]

  gateway:
    <<: *svc
    command: ["service","--name","gateway","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  ingest:
    <<: *svc
    command: ["service","--name","ingest","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  validate:
    <<: *svc
    command: ["service","--name","validate","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  device-registry:
    <<: *svc
    command: ["service","--name","device-registry","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  enrich:
    <<: *svc
    command: ["service","--name","enrich","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  store:
    <<: *svc
    command: ["service","--name","store","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]
  alerting:
    <<: *svc
    command: ["service","--name","alerting","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001"]

networks:
  default:
    name: sovloc-net
