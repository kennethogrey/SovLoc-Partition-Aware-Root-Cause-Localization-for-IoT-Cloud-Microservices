# Real multi-container deployment of the mesh (production tier).
# Scheduled fault:  make demo         (or ./scripts/compose_up.sh, faults validate)
# Live injection:   make demo-live    (healthy start), then make inject SERVICE=store
# Partition:        make partition    (cuts the cloud collector for 40s)
# Degrade link:     make netem        (250ms delay, 8% loss, 512kbit on the cloud)
#
# The two collectors run the SAME rca-core. A partition of the `cloud` collector
# reproduces the sovereignty result on real container networking. Every service
# listens on control port 9100 and every collector on 9101, so `mesh inject` can
# move the fault to any service while the mesh is running.

name: sovloc

x-svc: &svc
  build:
    context: .
    target: runtime
  restart: "no"
  cap_add: ["NET_ADMIN"] # allow tc/netem inside the container
  depends_on: [cloud, edge]

services:
  cloud:
    build:
      context: .
      target: runtime
    command: ["collector","--name","cloud","--port","7000","--expect-culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--control-port","9101"]
    cap_add: ["NET_ADMIN"]
  edge:
    build:
      context: .
      target: runtime
    command: ["collector","--name","edge","--port","7001","--expect-culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--control-port","9101"]

  gateway:
    <<: *svc
    command: ["service","--name","gateway","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  ingest:
    <<: *svc
    command: ["service","--name","ingest","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  validate:
    <<: *svc
    command: ["service","--name","validate","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  device-registry:
    <<: *svc
    command: ["service","--name","device-registry","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  enrich:
    <<: *svc
    command: ["service","--name","enrich","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  store:
    <<: *svc
    command: ["service","--name","store","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]
  alerting:
    <<: *svc
    command: ["service","--name","alerting","--culprit","${SOVLOC_CULPRIT:-validate}","--start-epoch-ms","${SOVLOC_EPOCH}","--fault-at-sec","15","--cloud","cloud:7000","--edge","edge:7001","--control-port","9100"]

networks:
  default:
    name: sovloc-net
