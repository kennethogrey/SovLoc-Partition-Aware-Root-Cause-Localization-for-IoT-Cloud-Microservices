# SovLoc cloud half on k3s. The three cloud microservices (enrich, store, alerting)
# and the cloud collector run on the k3s cluster, genuinely remote from the edge
# half (the four edge services + edge collector, driven by scripts/e6/run_events.sh
# on the harness host). The cloud services report to the cloud collector inside the
# cluster, so an edge->cloud partition (a route black-hole from the harness host to
# the cloud collector's NodePort) still leaves the cloud collector seeing its three
# local cloud services (3/7). "Cloud sees 0/7" is therefore a measured outcome of
# the cut, not a topology guarantee -- the review's central E6 objection.
#
# Deploy:
#   kubectl label node <cloud-node> sovloc-role=cloud          # optional pinning
#   sed -i "s#kennethogrey/sovloc-mesh:v5#<your-registry>/sovloc-mesh:<tag>#g" deploy/k3s/sovloc.yaml
#   kubectl apply -f deploy/k3s/sovloc.yaml
#   kubectl get svc cloud-collector      # note the NodePort (http 30080)
#   # the harness host then uses CLOUD_URL=http://<any-node-ip>:30080
# See RUNBOOK.md for the full E6 procedure.
#
# If instead you deploy BOTH halves in the cluster, add the edge Deployments and use
# scripts/e6/cut_k3s.sh (deploy/k3s/partition-netpol.yaml) for an in-cluster cut.
apiVersion: v1
kind: Service
metadata:
  name: cloud-collector
spec:
  type: NodePort
  selector: { app: cloud-collector }
  ports:
    - { name: http,    port: 8080, targetPort: 8080, nodePort: 30080 }
    - { name: control, port: 9200, targetPort: 9200 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cloud-collector }
spec:
  replicas: 1   # exactly one: a stateful central collector must not be split across replicas
  selector: { matchLabels: { app: cloud-collector } }
  template:
    metadata: { labels: { app: cloud-collector, sovloc-side: cloud } }
    spec:
      nodeSelector: { sovloc-role: cloud }
      containers:
        - name: collector
          image: kennethogrey/sovloc-mesh:v5
          args: ["collector","--name","cloud","--http-port","8080","--port","7000","--control-port","9200","--stale-ms","3000"]
          ports: [{ containerPort: 8080 }, { containerPort: 9200 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-enrich }
spec:
  replicas: 1
  selector: { matchLabels: { app: svc-enrich } }
  template:
    metadata: { labels: { app: svc-enrich, sovloc-side: cloud } }
    spec:
      nodeSelector: { sovloc-role: cloud }
      containers:
        - name: service
          image: kennethogrey/sovloc-mesh:v5
          args: ["service","--name","enrich","--culprit","none","--control-port","9114",
                 "--period-ms","200","--http-cloud","http://cloud-collector:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-store }
spec:
  replicas: 1
  selector: { matchLabels: { app: svc-store } }
  template:
    metadata: { labels: { app: svc-store, sovloc-side: cloud } }
    spec:
      nodeSelector: { sovloc-role: cloud }
      containers:
        - name: service
          image: kennethogrey/sovloc-mesh:v5
          args: ["service","--name","store","--culprit","none","--control-port","9115",
                 "--period-ms","200","--http-cloud","http://cloud-collector:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: svc-alerting }
spec:
  replicas: 1
  selector: { matchLabels: { app: svc-alerting } }
  template:
    metadata: { labels: { app: svc-alerting, sovloc-side: cloud } }
    spec:
      nodeSelector: { sovloc-role: cloud }
      containers:
        - name: service
          image: kennethogrey/sovloc-mesh:v5
          args: ["service","--name","alerting","--culprit","none","--control-port","9116",
                 "--period-ms","200","--http-cloud","http://cloud-collector:8080"]
