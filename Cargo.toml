# SovLoc, Partition-Aware Root-Cause Localization for IoT Cloud Microservices
# MCS 7101 Cloud Architecting & Engineering, Midterm (Topic CTA-MSC-13)
#
# This is a Cargo *workspace*: one repository holding several small crates
# (libraries/binaries) that are built together. See GUIDE.md Phase 1 for what
# every line here means if you have never seen Rust before.

[workspace]
resolver = "2"
members = [
    "crates/rca-core",   # the non-AI RCA algorithms (the scientific heart)
    "crates/sim",        # deterministic seeded simulation harness (headline results)
    "crates/mesh",       # the real tonic/gRPC microservice mesh (production tier)
]

# Versions are PINNED on purpose (exam §4.4 "reproducibility": pin, don't say
# 'works on my machine'). Do not use "*". These are stable, widely-used crates.
[workspace.dependencies]
rand        = "0.8.5"
rand_distr  = "0.4.3"
serde       = { version = "1.0.210", features = ["derive"] }
serde_json  = "1.0.128"
csv         = "1.3.0"
clap        = { version = "4.5.20", features = ["derive"] }
anyhow      = "1.0.89"

# Release profile: optimized builds for the benchmark runs.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
